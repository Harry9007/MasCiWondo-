<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MasCiWondo Móvil · Cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../web/css/estilos.css" />
  <style>
    .mobile-main {
      max-width: 520px;
      margin: 1.25rem auto;
      padding: 0 1rem;
      display: grid;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🥋 MasCiWondo</h1>
      <p class="subtitulo">Acceso móvil · Practicante y Entrenador</p>
    </div>
    <nav class="nav-links">
      <a href="./sesiones.html">Mis Sesiones</a>
      <a href="../web/index.html">Vista Web</a>
    </nav>
  </header>

  <main class="mobile-main">
    <section class="panel" id="seccion-cuenta">
      <div class="cuenta-header">
        <div>
          <p id="estado-sesion-usuario" class="subtitulo">No has iniciado sesión.</p>
        </div>
        <div class="acciones-sesion">
          <a href="./sesiones.html" id="btn-ir-sesiones" class="btn-secundario" style="display:none;">
            Ver Sesiones
          </a>
          <button type="button" id="btn-cerrar-sesion" class="btn-secundario" style="display:none;">
            Cerrar sesión
          </button>
        </div>
      </div>

      <div id="formularios-auth" class="auth-centrado-wrapper">
        <div class="auth-tabs" role="tablist">
          <button type="button" id="tab-login" class="auth-tab activa" data-target="form-login">
            Iniciar Sesión
          </button>
          <button type="button" id="tab-registro" class="auth-tab" data-target="form-registro">
            Crear Cuenta
          </button>
        </div>

        <form id="form-login" class="card-acceso auth-form-panel activo">
          <h2>🥋 MasCiWondo</h2>
          <p class="bienvenida-acceso">Bienvenido</p>

          <input type="email" id="loginEmail" placeholder="Correo electrónico" autocomplete="email" required />
          <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required />

          <button type="submit" class="btn-acceso">Iniciar Sesión</button>

          <p class="pie-acceso">
            ¿No tienes cuenta?
            <button type="button" class="link-inline-tab" data-ir-registro="true">Registrarse</button>
          </p>
        </form>

        <form id="form-registro" class="card-acceso stack auth-form-panel">
          <h2>🥋 MasCiWondo</h2>
          <p class="bienvenida-acceso">Crea tu cuenta</p>

          <label>
            Nombre completo
            <input type="text" id="regNombre" placeholder="Ej. Valentina Restrepo" required />
          </label>
          <label>
            Correo electrónico
            <input type="email" id="regEmail" placeholder="valentina@correo.com" autocomplete="email" required />
          </label>
          <label>
            Contraseña (mín. 6 caracteres)
            <input type="password" id="regPassword" minlength="6" autocomplete="new-password" required />
          </label>
          <label>
            Rol
            <select id="regRol">
              <option value="practicante">Practicante</option>
              <option value="entrenador">Entrenador</option>
            </select>
          </label>
          <label>
            Modalidad
            <select id="regModalidad">
              <option value="kyorugi">Kyorugi</option>
              <option value="poomsae">Poomsae</option>
              <option value="mixto">Mixto</option>
            </select>
          </label>
          <label>
            Nivel
            <select id="regNivel">
              <option value="iniciacion">Iniciación</option>
              <option value="intermedio" selected>Intermedio</option>
              <option value="competitivo">Competitivo</option>
            </select>
          </label>
          <label>
            Entrenador asignado (opcional)
            <select id="regEntrenadorId">
              <option value="">Sin asignar</option>
            </select>
          </label>
          <button type="submit" class="btn-acceso">Registrarme</button>
        </form>
      </div>

      <div id="mensaje-auth" class="resultado-box" style="margin-top:0.85rem;"></div>
    </section>
  </main>

  <script src="../web/js/api.js"></script>
  <script src="./js/mobileAuth.js"></script>
</body>
</html>
